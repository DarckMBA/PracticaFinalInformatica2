<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Técnico — Encuentra tu Cargador</title>
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="body-panel">
    <header>
        <h1>Panel de Técnico</h1>
        <button id="logoutBtn">Cerrar Sesión</button>
    </header>

    <main>
        <!-- INCIDENCIAS PENDIENTES -->
        <section>
            <h2>
                ⚠ Incidencias pendientes
                <span id="contadorPendientes" style="font-size:0.85em; color:#e74c3c;"></span>
            </h2>
            <p style="color:#888; margin-bottom:12px; font-size:0.9em;">
                Haz clic en <strong>Ver mapa</strong> para abrir la ubicación del cargador en Google Maps.
                Escribe un comentario técnico y pulsa <strong>Resolver</strong> para cerrar la incidencia.
            </p>
            <ul id="listaPendientes" style="list-style:none;"></ul>
        </section>

        <!-- INCIDENCIAS RESUELTAS -->
        <section>
            <h2>
                ✓ Incidencias resueltas
                <span id="contadorResueltas" style="font-size:0.85em; color:#27ae60;"></span>
            </h2>
            <ul id="listaResueltas" style="list-style:none;"></ul>
        </section>
    </main>

    <script type="module" src="../js/tecnico.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem("usuarioLogueado"));
        if (!usuario || usuario.rol !== "tecnico") {
            window.location.href = "/html/index.html";
        }
        document.getElementById("logoutBtn").onclick = () => {
            localStorage.removeItem("usuarioLogueado");
            window.location.href = "/html/index.html";
        };
    </script>
</body>
</html>
