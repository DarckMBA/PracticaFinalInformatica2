<!DOCTYPE html>
<html lang="es">
<head>
    <title>Encuentra tu Cargador</title>
    <meta name="description" content="Aplicación web para localizar cargadores de coche">
    <meta name="author" content="Marc Baleiron, Leo Seguín, Juan Ignacio Gonzalez, Carlos García, Alejandro Abanades">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image.jpg" href="../assets/ALFONSO-X.jpg">
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
    <div class="login-container">
        <h1>Iniciar Sesión</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="Email">Correo </label>
                <input type="email" id="Email" name="email" placeholder="Introduce tu correo" required/>
            </div>

            <div class="form-group">
                <label for="password">Contraseña </label>
                <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required/>
            </div>
        
            <button type="submit">Entrar</button>
        </form>
        <p id="mensaje"></p>
    </div>

    <script src="../js/login.js"></script>    
</body>
</html>
